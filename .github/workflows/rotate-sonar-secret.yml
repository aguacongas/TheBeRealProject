# Monitor the SONAR_SECRET token expiration and open an issue when a rotation is needed.
# Rotation is a manual, human-validated action (see the issue body).
name: SonarCloud token expiry check

on:
  # Runs daily at 06:00
  schedule:
    - cron: '0 6 * * *'
  # allow to launch the check manually
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      # Read the token expiry from the SonarCloud response header
      - name: Get token expiry
        id: expiry
        env:
          SONAR_SECRET: ${{ secrets.SONAR_SECRET }}
        run: |
          HEADERS=$(mktemp)
          curl -sS -D "$HEADERS" -o /dev/null \
            -H "Authorization: Bearer ${SONAR_SECRET}" \
            "https://sonarcloud.io/api/user_tokens/search"
          EXPIRES=$(grep -i "^SonarQube-Authentication-Token-Expiration:" "$HEADERS" | sed 's/^[^:]*: *//' | tr -d '\r')
          if [ -z "$EXPIRES" ]; then
            echo "Token has no expiration date"
            echo "needs_rotation=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EPOCH_EXP=$(date -d "$EXPIRES" +%s)
          EPOCH_NOW=$(date +%s)
          DAYS=$(( (EPOCH_EXP - EPOCH_NOW) / 86400 ))
          echo "expires=${EXPIRES}" >> "$GITHUB_OUTPUT"
          echo "days=${DAYS}" >> "$GITHUB_OUTPUT"
          if [ "$DAYS" -le 30 ]; then
            echo "needs_rotation=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rotation=false" >> "$GITHUB_OUTPUT"
          fi
      # Open or update the rotation issue when expiry is within 30 days
      - name: Notify rotation needed
        if: steps.expiry.outputs.needs_rotation == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          EXPIRES: ${{ steps.expiry.outputs.expires }}
          DAYS: ${{ steps.expiry.outputs.days }}
        run: |
          BODY="The SonarCloud token used as \`SONAR_SECRET\` expires on **$EXPIRES** (T-$DAYS days).

          To rotate it manually:
          1. Generate a new personal token in SonarCloud: My account > Access Tokens (name \`github-actions\`, expiry 90 days).
          2. Update the secret for both apps:
             - \`echo <new token> | gh secret set SONAR_SECRET -R aguacongas/TheBeRealProject --app actions\`
             - \`echo <new token> | gh secret set SONAR_SECRET -R aguacongas/TheBeRealProject --app dependabot\`
          3. Revoke the old token in SonarCloud.

          Then close this issue."
          BODY=$(printf '%s\n' "$BODY" | sed '2,$s/^          //')

          EXISTING=$(gh issue list -R aguacongas/TheBeRealProject --state open --limit 50 --search "SonarCloud token in:title" --json number,title \
            | jq -r '.[] | select(.title | contains("SonarCloud token")) | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" -R aguacongas/TheBeRealProject --body "$BODY"
            echo "updated issue #$EXISTING"
          else
            gh issue create -R aguacongas/TheBeRealProject --title "SonarCloud token expires on $EXPIRES" --body "$BODY"
          fi
      # Close the notification if the token was rotated or has no upcoming expiry
      - name: Close stale notification
        if: steps.expiry.outputs.needs_rotation == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          EXISTING=$(gh issue list -R aguacongas/TheBeRealProject --state open --limit 50 --search "SonarCloud token in:title" --json number,title \
            | jq -r '.[] | select(.title | contains("SonarCloud token")) | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" -R aguacongas/TheBeRealProject --comment "Token rotated or expiry more than 30 days away."
            echo "closed issue #$EXISTING"
          else
            echo "no stale notification to close"
          fi